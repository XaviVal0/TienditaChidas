<!-- BACKDROP -->
<div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">

  <!-- MODAL -->
  <div class="w-full max-w-2xl bg-white rounded-[28px] overflow-hidden shadow-2xl border border-zinc-200">

    <!-- HEADER -->
    <div class="relative bg-gradient-to-r from-zinc-900 to-zinc-800 px-6 py-5 text-white">

      <!-- CLOSE -->
      <button
        (click)="closeModal()"
        class="absolute top-4 right-4 w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 transition-all flex items-center justify-center text-sm"
      >
        ✕
      </button>

      <div class="flex items-center gap-3">

        <!-- ICON -->
        <div class="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center text-2xl">
          📦
        </div>

        <!-- TEXT -->
        <div>

          <h2 class="text-2xl font-bold">
            Nuevo Producto
          </h2>

          <p class="text-zinc-300 text-sm mt-1">
            Completa la información del producto.
          </p>

        </div>

      </div>

    </div>

    <!-- FORM -->
    <form class="p-6 space-y-5 bg-zinc-50">

      <!-- GRID -->
      <div class="grid md:grid-cols-2 gap-4">

        <!-- NAME -->
        <div class="bg-white rounded-2xl p-4 border border-zinc-200">

          <label class="text-sm font-medium text-zinc-700 block mb-2">
            Nombre
          </label>

          <input
            type="text"
            placeholder="iPhone 15 Pro"
            class="w-full bg-zinc-100 rounded-xl px-4 py-3 text-sm border border-transparent focus:outline-none focus:border-indigo-400 focus:bg-white transition-all"
          >

        </div>

        <!-- CATEGORY -->
        <div class="bg-white rounded-2xl p-4 border border-zinc-200">

          <label class="text-sm font-medium text-zinc-700 block mb-2">
            Categoría
          </label>

          <select
            class="w-full bg-zinc-100 rounded-xl px-4 py-3 text-sm border border-transparent focus:outline-none focus:border-indigo-400 focus:bg-white transition-all"
          >
            <option>Electrónica</option>
            <option>Audio</option>
            <option>Calzado</option>
            <option>Accesorios</option>
          </select>

        </div>

        <!-- PRICE -->
        <div class="bg-white rounded-2xl p-4 border border-zinc-200">

          <label class="text-sm font-medium text-zinc-700 block mb-2">
            Precio
          </label>

          <input
            type="number"
            placeholder="$0.00"
            class="w-full bg-zinc-100 rounded-xl px-4 py-3 text-sm border border-transparent focus:outline-none focus:border-indigo-400 focus:bg-white transition-all"
          >

        </div>

        <!-- STOCK -->
        <div class="bg-white rounded-2xl p-4 border border-zinc-200">

          <label class="text-sm font-medium text-zinc-700 block mb-2">
            Stock
          </label>

          <input
            type="number"
            placeholder="0"
            class="w-full bg-zinc-100 rounded-xl px-4 py-3 text-sm border border-transparent focus:outline-none focus:border-indigo-400 focus:bg-white transition-all"
          >

        </div>

      </div>

      <!-- STATUS -->
      <div class="bg-white rounded-2xl p-4 border border-zinc-200">

        <label class="text-sm font-medium text-zinc-700 block mb-2">
          Estado
        </label>

        <select
          class="w-full bg-zinc-100 rounded-xl px-4 py-3 text-sm border border-transparent focus:outline-none focus:border-indigo-400 focus:bg-white transition-all"
        >
          <option>Disponible</option>
          <option>Bajo Stock</option>
          <option>Agotado</option>
        </select>

      </div>

      <!-- IMAGE -->
      <div class="bg-white rounded-2xl p-4 border border-zinc-200">

        <label class="text-sm font-medium text-zinc-700 block mb-3">
          Imagen
        </label>

        <div class="border-2 border-dashed border-indigo-300 rounded-2xl p-6 text-center bg-indigo-50/40 hover:border-indigo-500 transition-all">

          <div class="space-y-3">

            <div class="text-4xl">
              📸
            </div>

            <div>

              <p class="text-sm font-medium text-zinc-700">
                Sube una imagen
              </p>

              <p class="text-xs text-zinc-500 mt-1">
                Arrastra o selecciona un archivo
              </p>

            </div>

            <button
              type="button"
              class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm transition-all"
            >
              Seleccionar
            </button>

          </div>

        </div>

      </div>

      <!-- DESCRIPTION -->
      <div class="bg-white rounded-2xl p-4 border border-zinc-200">

        <label class="text-sm font-medium text-zinc-700 block mb-2">
          Descripción
        </label>

        <textarea
          rows="4"
          placeholder="Describe el producto..."
          class="w-full bg-zinc-100 rounded-xl px-4 py-3 text-sm resize-none border border-transparent focus:outline-none focus:border-indigo-400 focus:bg-white transition-all"
        ></textarea>

      </div>

      <!-- ACTIONS -->
      <div class="flex justify-end gap-3 pt-1">

        <!-- CANCEL -->
        <button
          type="button"
          class="px-5 py-3 rounded-xl border border-zinc-300 text-zinc-700 hover:bg-zinc-100 text-sm transition-all"
        >
          Cancelar
        </button>

        <!-- SAVE -->
        <button
          type="submit"
          class="px-6 py-3 rounded-xl bg-zinc-900 hover:bg-black text-white text-sm font-medium transition-all"
        >
          Guardar
        </button>

      </div>

    </form>

  </div>

</div>
